<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учебное оформление — Chess Master</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body class="standalone-page">
    <header class="site-header">
        <h1>♔ Chess Master ♚</h1>
        <nav class="site-nav" aria-label="Основные страницы">
            <a href="chess.html">Игра</a>
            <a href="admin.html" id="admin-nav-link" style="display:none;">Админка</a>
            <a href="pay.html">Premium</a>
            <a href="checkout.html" aria-current="page">Оформление</a>
        </nav>
    </header>
    <main class="page-content payment-layout">
        <section class="panel payment-card">
            <span class="page-badge">Учебная заглушка</span>
            <h2>Оформление Premium</h2>
            <p class="payment-price">399 <small>₸</small></p>
            <p class="page-note">Настоящий эквайринг не подключён. Не вводите платёжные данные: эта страница их не запрашивает и не принимает.</p>
            <div class="notice-box" id="demo-notice" role="status">
                Никакого списания или изменения профиля не произойдёт.
            </div>
            <div class="page-actions">
                <button class="button button-primary" type="button" id="demo-button">Проверить учебную заглушку</button>
                <a class="button button-secondary" href="pay.html">Назад</a>
                <a class="button button-secondary" href="chess.html">К игре</a>
            </div>
        </section>
    </main>
    <script>
        try {
            const user = JSON.parse(localStorage.getItem('userData') || 'null');
            if (user && user.role === 'admin') document.getElementById('admin-nav-link').style.display = '';
        } catch (error) {
            console.warn('Не удалось восстановить роль для навигации:', error);
        }

        document.getElementById('demo-button').addEventListener('click', () => {
            document.getElementById('demo-notice').textContent =
                'Демонстрация завершена: платёж не выполнялся, Premium не изменён.';
        });
    </script>
</body>
</html>
